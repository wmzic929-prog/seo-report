<title>SEO 效能儀表板</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#f0f2f5;color:#1f2937;font-size:14px;line-height:1.5}
:root{
  --blue:#1a56db;--blue-l:#e8f0fe;
  --green:#057a55;--green-l:#def7ec;
  --orange:#c27803;--orange-l:#fdf6b2;
  --red:#c81e1e;--red-l:#fde8e8;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;
  --gray-400:#9ca3af;--gray-600:#6b7280;--gray-800:#1f2937;
  --shadow:0 1px 3px rgba(0,0,0,.08);--radius:8px
}

/* ── Header ── */
.hd{background:linear-gradient(135deg,#0f172a 0%,#1e40af 100%);color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.hd-left{display:flex;align-items:center;gap:14px}
.logo{font-size:16px;font-weight:800;letter-spacing:-0.5px;white-space:nowrap}
.logo em{color:#93c5fd;font-style:normal}
.group-label{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);color:#fff;padding:5px 12px;border-radius:6px;font-size:12px;display:flex;align-items:center;gap:6px;white-space:nowrap;font-weight:600}
/* ── Sub-tabs ── */
.sub-tabs-wrap{background:#f0f4ff;border-bottom:2px solid #c7d7fd;position:sticky;top:98px;z-index:180;overflow-x:auto}
.sub-tabs-wrap::-webkit-scrollbar{height:3px}
.sub-tabs-wrap::-webkit-scrollbar-thumb{background:#c7d7fd}
.sub-tabs-wrap .tabs{padding:0 16px}
.sub-tabs-wrap .tb{font-size:12px;padding:8px 13px;color:#4b6aaa;border-bottom-color:transparent}
.sub-tabs-wrap .tb:hover{color:var(--blue)}
.sub-tabs-wrap .tb.act{color:var(--blue);border-bottom-color:var(--blue)}
/* Phase tab badges */
.tb-badge.p0{background:#fef3c7;color:#92400e}
.tb-badge.p1{background:#d1fae5;color:#065f46}
.hd-right{font-size:11px;color:rgba(255,255,255,.65);text-align:right;line-height:1.6}
.hd-right strong{color:#fff;font-size:12px}

/* ── Site Tabs ── */
.tabs-wrap{background:#fff;border-bottom:2px solid var(--gray-200);position:sticky;top:56px;z-index:190;overflow-x:auto}
.tabs-wrap::-webkit-scrollbar{height:3px}
.tabs-wrap::-webkit-scrollbar-thumb{background:var(--gray-200)}
.tabs{display:flex;padding:0 16px;white-space:nowrap}
.tb{padding:11px 16px;background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--gray-600);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:color .15s,border-color .15s}
.tb:hover{color:var(--blue)}
.tb.act{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
.tb-badge{font-size:10px;padding:1px 7px;border-radius:100px;background:var(--blue-l);color:var(--blue);font-weight:600}
.tb-badge.main{background:#fef3c7;color:#92400e}

/* ── Content ── */
.content{padding:20px;max-width:1440px;margin:0 auto}
.panel{display:none}.panel.act{display:block}

/* ── Section label ── */
.sec-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--gray-400);margin:20px 0 10px}

/* ── KPI Cards ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:4px}
.kcard{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--gray-200);border-top:3px solid var(--gray-200)}
.kcard.c-blue{border-top-color:var(--blue)}
.kcard.c-green{border-top-color:var(--green)}
.kcard.c-orange{border-top-color:var(--orange)}
.kcard.c-red{border-top-color:var(--red)}
.kcard.c-purple{border-top-color:#7c3aed}
.kl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray-400);margin-bottom:6px;font-weight:600}
.kv{font-size:22px;font-weight:800;color:var(--gray-800);line-height:1}
.ks{font-size:11px;color:var(--gray-400);margin-top:3px}

/* ── Charts Row ── */
.charts-row{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin:14px 0}
.chart-card{background:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid var(--gray-200)}
.chart-title{font-size:12px;font-weight:700;color:var(--gray-800);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.chart-title span{width:10px;height:10px;border-radius:2px;display:inline-block}

/* ── Two-col section ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.card{background:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid var(--gray-200)}
.card-title{font-size:12px;font-weight:700;color:var(--gray-800);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.ci{width:22px;height:22px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.ci-blue{background:var(--blue-l);color:var(--blue)}
.ci-green{background:var(--green-l);color:var(--green)}
.ci-orange{background:var(--orange-l);color:var(--orange)}
.ci-purple{background:#f5f3ff;color:#7c3aed}

/* ── Coverage bar ── */
.cov-item{margin-bottom:12px}
.cov-row{display:flex;justify-content:space-between;font-size:11px;color:var(--gray-600);margin-bottom:4px}
.cov-row strong{font-weight:700;color:var(--gray-800)}
.bar-wrap{height:8px;background:var(--gray-100);border-radius:100px;overflow:hidden}
.bar-fill{height:100%;border-radius:100px;transition:width .8s ease}
.bar-g{background:var(--green)}.bar-w{background:var(--orange)}.bar-r{background:var(--red)}

/* ── CWV ── */
.cwv-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.cwv-item{text-align:center;padding:14px 8px;border-radius:6px;border:1px solid var(--gray-200)}
.cwv-name{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray-400);font-weight:600}
.cwv-val{font-size:20px;font-weight:800;margin:6px 0 4px}
.cwv-unit{font-size:10px;color:var(--gray-400)}
.badge{display:inline-block;padding:2px 8px;border-radius:100px;font-size:10px;font-weight:700}
.bg{background:var(--green-l);color:var(--green)}
.bw{background:var(--orange-l);color:var(--orange)}
.br{background:var(--red-l);color:var(--red)}
.cwv-score-wrap{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--gray-100)}
.cwv-score-label{font-size:11px;color:var(--gray-600)}
.cwv-score-val{font-size:22px;font-weight:800;color:var(--green)}

/* ── Table ── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 10px;background:var(--gray-50);color:var(--gray-400);font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--gray-200);white-space:nowrap;font-weight:700}
td{padding:9px 10px;border-bottom:1px solid var(--gray-100);color:var(--gray-800);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--gray-50)}
.pos-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:100px}
.pos-good{background:var(--green-l);color:var(--green)}
.pos-mid{background:var(--blue-l);color:var(--blue)}
.pos-low{background:var(--gray-100);color:var(--gray-600)}

/* ── Overview comparison table ── */
.ov-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.ov-title{font-size:13px;font-weight:700;color:var(--gray-800)}
.site-role-main{background:#fef3c7;color:#92400e;font-size:10px;padding:1px 7px;border-radius:100px;font-weight:700}
.site-role-sat{background:var(--blue-l);color:var(--blue);font-size:10px;padding:1px 7px;border-radius:100px;font-weight:700}
.meter{display:inline-block;width:40px;height:5px;background:var(--gray-200);border-radius:100px;vertical-align:middle;position:relative;overflow:hidden}
.meter-fill{position:absolute;left:0;top:0;height:100%;border-radius:100px}

/* ── Responsive ── */
@media(max-width:900px){
  .charts-row{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .content{padding:12px}
  .cwv-grid{grid-template-columns:1fr 1fr 1fr}
}
@media(max-width:480px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .cwv-grid{grid-template-columns:1fr}
}

/* ── AI Crawler badges ── */
.ai-badge{display:inline-block;padding:2px 7px;border-radius:100px;font-size:10px;font-weight:700;margin:1px 2px;white-space:nowrap}
.ai-fresh{background:#d1fae5;color:#065f46}
.ai-stale{background:#f3f4f6;color:#6b7280}
.ai-none{color:var(--gray-300);font-size:11px}
.ai-table{width:100%;border-collapse:collapse;font-size:12px}
.ai-table th{text-align:left;padding:8px 10px;background:var(--gray-50);color:var(--gray-400);font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--gray-200);font-weight:700}
.ai-table td{padding:9px 10px;border-bottom:1px solid var(--gray-100);vertical-align:middle}
.ai-table tr:last-child td{border-bottom:none}

/* ── Loading state ── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;color:var(--gray-400);gap:12px;font-size:13px}
.spinner{width:32px;height:32px;border:3px solid var(--gray-200);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ext-link{display:inline-flex;align-items:center;gap:2px;padding:2px 7px;background:var(--blue-l);color:var(--blue);text-decoration:none;border-radius:4px;font-size:10px;font-weight:600;vertical-align:middle;margin-left:4px;opacity:.8;transition:opacity .15s;white-space:nowrap}
.ext-link:hover{opacity:1;background:#c7d7fd}

const covBadge = r => r >= 0.8 ? 'bg' : r >= 0.5 ? 'bw' : 'br';

  if (metric === 'inp') return val <= 200 ? 'bg' : val <= 500 ? 'bw' : 'br';
};

  if (metric === 'cls') return val <= 0.1 ? '良好' : val <= 0.25 ? '待改善' : '差';
  if (metric === 'inp') return val <= 200 ? '良好' : val <= 500 ? '待改善' : '差';
};

// ── Task 1: CWV color helper ──────────────────────────
function cwvColor(metric, value) {
  const thresholds = {
    lcp:   [1200, 2500],
    cls:   [0.1,  0.25],
    inp:   [200,  500],
    score: [90,   50]
  };
  const t = thresholds[metric];
  if (!t) return '#6b7280';
  const [good, poor] = t;
  if (metric === 'score') {
    return value >= good ? '#22c55e' : value >= poor ? '#f59e0b' : '#ef4444';
  }
  return value <= good ? '#22c55e' : value <= poor ? '#f59e0b' : '#ef4444';
}

// ── Task 2: Search trend helper ───────────────────────
function searchTrend(series7d) {
  if (!series7d || !series7d.impressions || series7d.impressions.length < 6) return '';
  const imp = series7d.impressions;
  const first3 = (imp[0] + imp[1] + imp[2]) / 3;
  const last3 = (imp[imp.length-3] + imp[imp.length-2] + imp[imp.length-1]) / 3;
  if (first3 === 0) return '';
  const change = (last3 - first3) / first3;
  if (change > 0.1) return ' <span style="color:#22c55e">↑</span>';
  if (change < -0.1) return ' <span style="color:#ef4444">↓</span>';
  return ' <span style="color:#6b7280">→</span>';
}

    <div class="kcard c-green"><div class="kl">GSC曝光 (28d)</div><div class="kv">${(!s.gsc || s.gsc.avg_position === 0) ? gscPendingBadge() : fmt(s.gsc.impressions_28d)}</div><div class="ks">Impressions</div></div>
    <div class="kcard c-green"><div class="kl">GSC點擊 (28d)</div><div class="kv">${(!s.gsc || s.gsc.avg_position === 0) ? gscPendingBadge() : fmt(s.gsc.clicks_28d)}</div><div class="ks">Clicks</div></div>
    <div class="kcard"><div class="kl">點擊率 CTR</div><div class="kv">${(!s.gsc || s.gsc.avg_position === 0) ? gscPendingBadge() : pct(s.gsc.ctr)}</div><div class="ks">點擊÷曝光</div></div>
    <div class="kcard"><div class="kl">平均排名</div><div class="kv">${(!s.gsc || s.gsc.avg_position === 0) ? gscPendingBadge() : s.gsc.avg_position.toFixed(1)}</div><div class="ks">Avg. Position</div></div>
  </div>

  <div class="sec-label">Core Web Vitals</div>
  <div class="card">
    ${(s.cwv && Object.keys(s.cwv).length > 0) ? `
    <div class="cwv-grid">
      <div class="cwv-item">
        <div class="cwv-name">LCP</div>
        <div class="cwv-val" style="color:${cwvColor('lcp', s.cwv.lcp)}">${s.cwv.lcp >= 1000 ? (s.cwv.lcp/1000).toFixed(1) : s.cwv.lcp}</div>
        <div class="cwv-unit">秒</div>
        <span class="badge ${cwvStatus('lcp', s.cwv.lcp)}">${cwvLabel('lcp', s.cwv.lcp)}</span>
      </div>
      <div class="cwv-item">
        <div class="cwv-name">CLS</div>
        <div class="cwv-val" style="color:${cwvColor('cls', s.cwv.cls)}">${s.cwv.cls.toFixed(2)}</div>
        <div class="cwv-unit">位移分數</div>
        <span class="badge ${cwvStatus('cls', s.cwv.cls)}">${cwvLabel('cls', s.cwv.cls)}</span>
      </div>
      <div class="cwv-item">
        <div class="cwv-name">INP</div>
        <div class="cwv-val" style="color:${cwvColor('inp', s.cwv.inp)}">${s.cwv.inp}</div>
        <div class="cwv-unit">ms</div>
        <span class="badge ${cwvStatus('inp', s.cwv.inp)}">${cwvLabel('inp', s.cwv.inp)}</span>
      </div>
    </div>
    <div class="cwv-score-wrap">
      <span class="cwv-score-label">Performance Score</span>
      <span class="cwv-score-val" style="color:${cwvColor('score', s.cwv.score)}">${s.cwv.score}</span>
    </div>` : '<div style="color:var(--gray-300);font-size:12px;text-align:center;padding:12px 0">無 CWV 數據</div>'}
  </div>

  <div class="two-col">
    <div class="card">
      <div class="card-title"><span class="ci ci-green">&#128269;</span>Google 收錄狀態</div>
      <div class="cov-item">
        <div class="cov-row"><span>Sitemap 提交</span><strong>${s.sitemap.total_urls} 頁</strong></div>
      </div>
      <div class="cov-item">
        <div class="cov-row"><span>Google 收錄</span><strong>${s.gsc.indexed_pages} 頁</strong></div>
        <div class="bar-wrap"><div class="bar-fill ${covClass(cov)}" style="width:${Math.min(cov*100,100)}%"></div></div>
      </div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--gray-100)">
        <span style="font-size:12px;color:var(--gray-600)">收錄率</span>
        <span class="badge ${covBadge(cov)}" style="font-size:14px;padding:4px 14px">${pct(cov)}</span>
      </div>
    </div>
    <div class="card">
      <div class="card-title"><span class="ci ci-purple">&#128196;</span>內容生產</div>
      <div class="kpi-grid" style="grid-template-columns:1fr 1fr;gap:10px">
        <div class="kcard c-purple"><div class="kl">Blog 文章</div><div class="kv">${s.content.total_articles}</div><div class="ks">已發佈</div></div>
        <div class="kcard c-purple"><div class="kl">本月新發</div><div class="kv">${s.content.this_month}</div><div class="ks">本月</div></div>
        ${s.role === 'main' || s.content.sports_articles > 0 ? `<div class="kcard c-blue"><div class="kl">體育新聞</div><div class="kv">${s.content.sports_articles||0}</div><div class="ks">已發佈</div></div>` : ''}
        <div class="kcard"><div class="kl">本週新發</div><div class="kv">${s.content.this_week}</div><div class="ks">本週</div></div>
      </div>
    </div>
  </div>

  <div class="sec-label">7日每日趨勢</div>
  <div class="card">
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>日期</th><th>GA4流量</th><th>GSC曝光</th><th>GSC點擊</th><th>CTA點擊</th><th>文章總數</th>
        </tr></thead>
        <tbody>${d7rows || '<tr><td colspan="6" style="text-align:center;color:var(--gray-300)">無資料</td></tr>'}</tbody>
      </table>
      <div style="font-size:10px;color:var(--gray-300);padding:4px 0">GSC 資料有 1-2 天延遲，最近 1-2 天顯示 —</div>
    </div>
  </div>

  <div class="sec-label">AI 爬蟲訪問紀錄</div>
  <div class="card">
    <div class="tbl-wrap">
      <table class="ai-table">
        <thead><tr><th>爬蟲</th><th>最後訪問</th><th>30日次數</th><th>對應 AI 產品</th></tr></thead>
        <tbody>${ALL_AI_CRAWLERS.map(name => {
          const info = (s.ai_crawlers || {})[name];
          const days = info ? aiLastSeen(info.last_seen) : null;
          const isFresh = days !== null && days <= 7;
          if (info) {
            const dateStr = info.last_seen ? info.last_seen.slice(0,10) : '–';
            const daysStr = days === 0 ? '今天' : days === 1 ? '1 天前' : days + ' 天前';
            return `<tr>
              <td><span class="ai-badge ${isFresh ? 'ai-fresh' : 'ai-stale'}">${name}</span></td>
              <td style="color:var(--gray-800)">${dateStr} <span style="font-size:10px;color:var(--gray-400)">(${daysStr})</span></td>
              <td style="font-weight:700">${info.count_30d || 0} 次</td>
              <td style="color:var(--gray-600)">${AI_CRAWLER_PRODUCTS[name] || ''}</td>
            </tr>`;
          }
          return `<tr style="opacity:.45">
            <td><span class="ai-badge ai-stale">${name}</span></td>
            <td style="color:var(--gray-300)">未偵測到</td>
            <td style="color:var(--gray-300)">–</td>
            <td style="color:var(--gray-400)">${AI_CRAWLER_PRODUCTS[name] || ''}</td>
          </tr>`;
        }).join('')}</tbody>
      </table>
    </div>
  </div>

  <div class="sec-label">GSC 高流量關鍵字</div>
  <div class="card">
    <div class="tbl-wrap">
      <table>
        <thead><tr><th>關鍵字</th><th>平均排名</th><th>點擊數 (28d)</th></tr></thead>
        <tbody>${kwRows}</tbody>
      </table>
    </div>
  </div>`;
}

// ── Chart Renderers ───────────────────────────────────
function renderTrafficChart(domain, s, dates) {
  const ctx = document.getElementById(`chart-traffic-${domain}`);
  if (!ctx) return;
  charts[`traffic-${domain}`] = new Chart(ctx, {
    type: 'line',
    data: {
      labels: dates,
      datasets: [{
        label: 'Sessions', data: s.traffic.series_30d,
        borderColor: '#1a56db', backgroundColor: 'rgba(26,86,219,0.08)',
        borderWidth: 2, fill: true, tension: 0.4, pointRadius: 2, pointHoverRadius: 4
      }]
    },
    options: {
      responsive: true, maintainAspectRatio: true,
      plugins: { legend: { display: false } },
      scales: {
        x: { grid: { display: false }, ticks: { font: { size: 10 }, maxTicksLimit: 10 } },
        y: { grid: { color: '#f0f0f0' }, ticks: { font: { size: 10 }, precision: 0 }, beginAtZero: true }
      }
    }
  });
}

function renderSourcesChart(domain, s) {
  const ctx = document.getElementById(`chart-src-${domain}`);
  if (!ctx) return;
  const src = s.traffic.sources;
  charts[`src-${domain}`] = new Chart(ctx, {
    type: 'doughnut',
    data: {
      labels: ['自然搜尋', '直接', '社群', '推薦'],
      datasets: [{ data: [src.organic, src.direct, src.social, src.referral].map(v => Math.round(v*100)),
        backgroundColor: ['#1a56db','#6b7280','#0d9488','#c27803'],
        borderWidth: 0, hoverOffset: 4 }]
    },
    options: {
      responsive: true, maintainAspectRatio: true, cutout: '65%',
      plugins: {
        legend: { position: 'bottom', labels: { font: { size: 11 }, padding: 12, usePointStyle: true, pointStyleWidth: 8 } },
        tooltip: { callbacks: { label: ctx => ` ${ctx.label}: ${ctx.raw}%` } }
      }
    }
  });
}

// ── Boot ─────────────────────────────────────────────
init();
</script>
</body>
</html>
