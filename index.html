<title>SEO 效能儀表板</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;background:#f0f2f5;color:#1f2937;font-size:14px;line-height:1.5}
:root{
  --blue:#1a56db;--blue-l:#e8f0fe;
  --green:#057a55;--green-l:#def7ec;
  --orange:#c27803;--orange-l:#fdf6b2;
  --red:#c81e1e;--red-l:#fde8e8;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;
  --gray-400:#9ca3af;--gray-600:#6b7280;--gray-800:#1f2937;
  --shadow:0 1px 3px rgba(0,0,0,.08);--radius:8px;
  --gx-tb-color:#1a56db
}

/* ── Header ── */
.hd{background:linear-gradient(135deg,#0f172a 0%,#1e40af 100%);color:#fff;padding:0 24px;height:56px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;box-shadow:0 2px 12px rgba(0,0,0,.25)}
.hd-left{display:flex;align-items:center;gap:14px}
.logo{font-size:16px;font-weight:800;letter-spacing:-0.5px;white-space:nowrap}
.logo em{color:#93c5fd;font-style:normal}
.hd-right{font-size:11px;color:rgba(255,255,255,.65);text-align:right;line-height:1.6}
.hd-right strong{color:#fff;font-size:12px}

/* ── Galaxy Bar ── */
.galaxy-bar{background:#0f172a;border-bottom:1px solid rgba(255,255,255,.1);position:sticky;top:56px;z-index:185;overflow-x:auto;display:flex;align-items:stretch;padding:0 8px;height:40px;white-space:nowrap}
.galaxy-bar::-webkit-scrollbar{height:3px}
.galaxy-bar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2)}
.gx-tab{padding:0 14px;background:none;border:none;border-bottom:2px solid transparent;color:rgba(255,255,255,.5);font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:color .15s,border-color .15s;white-space:nowrap;font-weight:600}
.gx-tab:hover{color:rgba(255,255,255,.9)}
.gx-tab.act{color:#fff;border-bottom-color:var(--gx-act-color,#60a5fa)}
.gx-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.gx-count{font-size:10px;background:rgba(255,255,255,.15);padding:1px 6px;border-radius:10px;font-weight:700}
.gx-sep{width:1px;background:rgba(255,255,255,.1);margin:8px 4px;flex-shrink:0}

/* ── Group Tabs (Level 1) ── */
.tabs-wrap{background:#fff;border-bottom:2px solid var(--gray-200);position:sticky;top:96px;z-index:190;overflow-x:auto}
.tabs-wrap::-webkit-scrollbar{height:3px}
.tabs-wrap::-webkit-scrollbar-thumb{background:var(--gray-200)}
.tabs{display:flex;padding:0 16px;white-space:nowrap}
.tb{padding:11px 16px;background:none;border:none;border-bottom:2px solid transparent;margin-bottom:-2px;color:var(--gray-600);font-size:13px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:color .15s,border-color .15s}
.tb:hover{color:var(--gx-tb-color)}
.tb.act{color:var(--gx-tb-color);border-bottom-color:var(--gx-tb-color);font-weight:600}
.tb-badge{font-size:10px;padding:1px 7px;border-radius:100px;background:var(--blue-l);color:var(--blue);font-weight:600}
.tb-badge.main{background:#fef3c7;color:#92400e}
.tb-badge.p0{background:#fef3c7;color:#92400e}
.tb-badge.p1{background:#d1fae5;color:#065f46}

/* ── Sub-tabs (Level 2) ── */
.sub-tabs-wrap{background:#f0f4ff;border-bottom:2px solid #c7d7fd;position:sticky;top:140px;z-index:180;overflow-x:auto}
.sub-tabs-wrap::-webkit-scrollbar{height:3px}
.sub-tabs-wrap::-webkit-scrollbar-thumb{background:#c7d7fd}
.sub-tabs-wrap .tabs{padding:0 16px}
.sub-tabs-wrap .tb{font-size:12px;padding:8px 13px;color:#4b6aaa;border-bottom-color:transparent}
.sub-tabs-wrap .tb:hover{color:var(--gx-tb-color)}
.sub-tabs-wrap .tb.act{color:var(--gx-tb-color);border-bottom-color:var(--gx-tb-color)}

/* ── Content ── */
.content{padding:20px;max-width:1440px;margin:0 auto}

/* ── Section label ── */
.sec-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--gray-400);margin:20px 0 10px}

/* ── KPI Cards ── */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:4px}
.kcard{background:#fff;border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--gray-200);border-top:3px solid var(--gray-200)}
.kcard.c-blue{border-top-color:var(--blue)}
.kcard.c-green{border-top-color:var(--green)}
.kcard.c-orange{border-top-color:var(--orange)}
.kcard.c-red{border-top-color:var(--red)}
.kcard.c-purple{border-top-color:#7c3aed}
.kl{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray-400);margin-bottom:6px;font-weight:600}
.kv{font-size:22px;font-weight:800;color:var(--gray-800);line-height:1}
.ks{font-size:11px;color:var(--gray-400);margin-top:3px}

/* ── Galaxy Overview Cards ── */
.gx-cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;margin-bottom:20px}
.gx-card{background:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);border:1px solid var(--gray-200);border-top:3px solid #e5e7eb;cursor:pointer;transition:box-shadow .15s,transform .15s}
.gx-card:hover{box-shadow:0 6px 20px rgba(0,0,0,.1);transform:translateY(-2px)}
.gx-card-header{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.gx-card-name{font-size:15px;font-weight:800;color:var(--gray-800)}
.gx-card-count{margin-left:auto;font-size:11px;color:var(--gray-400);background:var(--gray-100);padding:2px 8px;border-radius:10px}
.gx-card-kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gx-kpi{padding:10px 12px;border-radius:6px;background:var(--gray-50);border:1px solid var(--gray-200)}
.gx-kpi .kl{margin-bottom:3px}
.gx-kpi .kv{font-size:18px}
.gx-card-footer{margin-top:14px;padding-top:12px;border-top:1px solid var(--gray-100);text-align:right;font-size:12px;font-weight:600}

/* ── Charts Row ── */
.charts-row{display:grid;grid-template-columns:2fr 1fr;gap:14px;margin:14px 0}
.chart-card{background:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid var(--gray-200)}
.chart-title{font-size:12px;font-weight:700;color:var(--gray-800);margin-bottom:14px;display:flex;align-items:center;gap:6px}
.chart-title span{width:10px;height:10px;border-radius:2px;display:inline-block}

/* ── Two-col ── */
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.card{background:#fff;border-radius:var(--radius);padding:18px;box-shadow:var(--shadow);border:1px solid var(--gray-200)}
.card-title{font-size:12px;font-weight:700;color:var(--gray-800);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.ci{width:22px;height:22px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0}
.ci-blue{background:var(--blue-l);color:var(--blue)}
.ci-green{background:var(--green-l);color:var(--green)}
.ci-orange{background:var(--orange-l);color:var(--orange)}
.ci-purple{background:#f5f3ff;color:#7c3aed}

/* ── Coverage bar ── */
.cov-item{margin-bottom:12px}
.cov-row{display:flex;justify-content:space-between;font-size:11px;color:var(--gray-600);margin-bottom:4px}
.cov-row strong{font-weight:700;color:var(--gray-800)}
.bar-wrap{height:8px;background:var(--gray-100);border-radius:100px;overflow:hidden}
.bar-fill{height:100%;border-radius:100px;transition:width .8s ease}
.bar-g{background:var(--green)}.bar-w{background:var(--orange)}.bar-r{background:var(--red)}

/* ── CWV ── */
.cwv-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.cwv-item{text-align:center;padding:14px 8px;border-radius:6px;border:1px solid var(--gray-200)}
.cwv-name{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--gray-400);font-weight:600}
.cwv-val{font-size:20px;font-weight:800;margin:6px 0 4px}
.cwv-unit{font-size:10px;color:var(--gray-400)}
.badge{display:inline-block;padding:2px 8px;border-radius:100px;font-size:10px;font-weight:700}
.bg{background:var(--green-l);color:var(--green)}
.bw{background:var(--orange-l);color:var(--orange)}
.br{background:var(--red-l);color:var(--red)}
.cwv-score-wrap{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--gray-100)}
.cwv-score-label{font-size:11px;color:var(--gray-600)}
.cwv-score-val{font-size:22px;font-weight:800;color:var(--green)}

/* ── Table ── */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:12px}
th{text-align:left;padding:8px 10px;background:var(--gray-50);color:var(--gray-400);font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--gray-200);white-space:nowrap;font-weight:700}
td{padding:9px 10px;border-bottom:1px solid var(--gray-100);color:var(--gray-800);white-space:nowrap}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--gray-50)}
.pos-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:100px}
.pos-good{background:var(--green-l);color:var(--green)}
.pos-mid{background:var(--blue-l);color:var(--blue)}
.pos-low{background:var(--gray-100);color:var(--gray-600)}
.site-role-main{background:#fef3c7;color:#92400e;font-size:10px;padding:1px 7px;border-radius:100px;font-weight:700}
.site-role-sat{background:var(--blue-l);color:var(--blue);font-size:10px;padding:1px 7px;border-radius:100px;font-weight:700}
.meter{display:inline-block;width:40px;height:5px;background:var(--gray-200);border-radius:100px;vertical-align:middle;position:relative;overflow:hidden}
.meter-fill{position:absolute;left:0;top:0;height:100%;border-radius:100px}

/* ── AI Crawler ── */
.ai-badge{display:inline-block;padding:2px 7px;border-radius:100px;font-size:10px;font-weight:700;margin:1px 2px;white-space:nowrap}
.ai-fresh{background:#d1fae5;color:#065f46}
.ai-stale{background:#f3f4f6;color:#6b7280}
.ai-none{color:var(--gray-300);font-size:11px}
.ai-table{width:100%;border-collapse:collapse;font-size:12px}
.ai-table th{text-align:left;padding:8px 10px;background:var(--gray-50);color:var(--gray-400);font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-bottom:1px solid var(--gray-200);font-weight:700}
.ai-table td{padding:9px 10px;border-bottom:1px solid var(--gray-100);vertical-align:middle}
.ai-table tr:last-child td{border-bottom:none}

/* ── Loading ── */
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:200px;color:var(--gray-400);gap:12px;font-size:13px}
.spinner{width:32px;height:32px;border:3px solid var(--gray-200);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ext-link{display:inline-flex;align-items:center;gap:2px;padding:2px 7px;background:var(--blue-l);color:var(--blue);text-decoration:none;border-radius:4px;font-size:10px;font-weight:600;vertical-align:middle;margin-left:4px;opacity:.8;transition:opacity .15s;white-space:nowrap}
.ext-link:hover{opacity:1;background:#c7d7fd}

/* ── Responsive ── */
@media(max-width:900px){
  .charts-row{grid-template-columns:1fr}
  .two-col{grid-template-columns:1fr}
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .content{padding:12px}
  .cwv-grid{grid-template-columns:1fr 1fr 1fr}
  .gx-cards-grid{grid-template-columns:1fr}
}
@media(max-width:480px){
  .kpi-grid{grid-template-columns:repeat(2,1fr)}
  .cwv-grid{grid-template-columns:1fr}
}
</style>
</head>

const cwvLabel = (m, v) => {

function cwvColor(m, v) {
  const t={lcp:[1200,2500],cls:[0.1,0.25],inp:[200,500],score:[90,50]};
  const r=t[m]; if(!r) return '#6b7280';
  const[good,poor]=r;
  if(m==='score') return v>=good?'#22c55e':v>=poor?'#f59e0b':'#ef4444';
  return v<=good?'#22c55e':v<=poor?'#f59e0b':'#ef4444';
}
function searchTrend(series7d) {
  if (!series7d||!series7d.impressions||series7d.impressions.length<6) return '';
  const imp=series7d.impressions, f3=(imp[0]+imp[1]+imp[2])/3, l3=(imp[imp.length-3]+imp[imp.length-2]+imp[imp.length-1])/3;
  if (f3===0) return '';
  const c=(l3-f3)/f3;
  return c>0.1?' <span style="color:#22c55e">↑</span>':c<-0.1?' <span style="color:#ef4444">↓</span>':' <span style="color:#6b7280">→</span>';
}

// ── Init ──────────────────────────────────────────────
async function init() {
  try {
    const res = await fetch(REAL_DATA_URL, { cache:'no-store' });
    if (!res.ok) throw new Error('not found');
    DATA = await res.json();
    if (!DATA.groups) DATA.groups = {};
    const sg = DATA.groups.spheretap;
    if (sg) {
      sg.name = 'Spheretap';
      if (!sg.phases) sg.phases = SPHERETAP_PHASES;
      if (!sg.dates_30d) sg.dates_30d = MOCK.groups.spheretap.dates_30d;
      for (const [domain, label] of Object.entries(SPHERETAP_P1_LABELS)) {
        if (!sg.sites[domain]) sg.sites[domain] = siteStub(label);
      }
    }
    const bduk = DATA.groups.bduk;
    if (bduk) {
      bduk.name = 'BDUK';
      if (!bduk.phases) bduk.phases = BDUK_PHASES;
      if (!bduk.dates_30d) bduk.dates_30d = MOCK.groups.bduk.dates_30d;
      for (const [domain, label] of Object.entries(BDUK_LABELS)) {
        if (!bduk.sites[domain]) bduk.sites[domain] = siteStub(label);
      }
    } else {
      DATA.groups.bduk = MOCK.groups.bduk;
    }
  } catch {
    DATA = MOCK;
  }
  // Back-fill cta summary from daily_7d / cta_series_7d when aggregator hasn't computed them yet
  for (const g of Object.values(DATA.groups||{})) {
    for (const site of Object.values(g.sites||{})) {
      if (!site.cta) continue;
      if (!site.cta.clicks_7d) {
        if (site.daily_7d && site.daily_7d.length) {
          site.cta.clicks_7d = site.daily_7d.reduce((a,r)=>a+(r.cta_clk||0), 0);
          site.cta.clicks_today = site.daily_7d[site.daily_7d.length-1].cta_clk || 0;
        } else if (site.traffic && site.traffic.cta_series_7d && site.traffic.cta_series_7d.length) {
          const ser = site.traffic.cta_series_7d;
          site.cta.clicks_7d = ser.reduce((a,v)=>a+v, 0);
          site.cta.clicks_today = ser[ser.length-1] || 0;
        }
      }
    }
  }
  if (window.__WEEKLY_REPORT_MODE) return;
  const dt = new Date(DATA.generated_at);
  document.getElementById('hd-update').textContent =
    `資料更新: ${dt.getMonth()+1}/${dt.getDate()} ${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')} HKT`;
  buildGalaxyBar();
  switchGalaxy('all');
  // if (DATA.alerts) renderAlertBanner(DATA); // disabled: alert banner turned off
  startClock();
}

function startClock() {
  function tick() {
    const hkt = new Date(new Date().toLocaleString('en-US',{timeZone:'Asia/Hong_Kong'}));
    document.getElementById('hd-now').textContent =
      `${hkt.getMonth()+1}/${hkt.getDate()} ${String(hkt.getHours()).padStart(2,'0')}:${String(hkt.getMinutes()).padStart(2,'0')} HKT`;
  }
  tick(); setInterval(tick, 60000);
}

function switchGroupTab(key) {
  currentTab = key;
  currentSubSite = null;
  updateGroupTabActive();
  const subWrap = document.getElementById('sub-tabs-wrap');
  const g = DATA.groups[currentGalaxy];
  const mainDomain = Object.keys(g.sites).find(d => g.sites[d].role === 'main') || '';

    subWrap.style.display = 'none';
    document.getElementById('sub-tabs').innerHTML = '';

    buildSubTabs(currentGalaxy, phaseNum);

    const sites = phases[phaseNum] || [];
    if (sites.length) switchSubSite(sites[0]);
  }

// ── Click from overview table → jump to site ──────────
function switchSite(domain) {
  // If in 'all' view, first determine which galaxy owns this domain
  let gk = currentGalaxy === 'all' ? findDomainGalaxy(domain) : currentGalaxy;
  if (!gk) return;
  if (currentGalaxy === 'all') {
    currentGalaxy = gk;
    updateGalaxyActive();
    const cfg = GALAXY_CONFIG[gk] || { color:'#1a56db' };
    document.documentElement.style.setProperty('--gx-tb-color', cfg.color);
    buildGroupTabs(gk);
  }
  const g = DATA.groups[gk];
  const mainDomain = Object.keys(g.sites).find(d => g.sites[d].role === 'main') || '';
  if (domain === mainDomain) { switchGroupTab(domain); return; }
  const phases = g.phases || {};
  let phaseNum = null;
  for (const [p, domains] of Object.entries(phases)) {
    if (domains.includes(domain)) { phaseNum = parseInt(p); break; }
  }
  if (phaseNum !== null) {
    currentTab = `__phase${phaseNum}__`;
    updateGroupTabActive();
    buildSubTabs(gk, phaseNum);
    document.getElementById('sub-tabs-wrap').style.display = '';
    switchSubSite(domain);
  }
}

function findDomainGalaxy(domain) {
  for (const [gk, g] of Object.entries(DATA.groups)) {
    if (g.sites[domain]) return gk;
  }
  return null;
}

// ── Single Galaxy Overview ────────────────────────────
function renderOverview(g, gk) {
  const cfg = GALAXY_CONFIG[gk] || { color:'#1a56db', colorLight:'#e8f0fe' };
  const sites = Object.entries(g.sites);
  const totSess30 = sites.reduce((a,[,s])=>a+s.traffic.sessions_30d, 0);
  const totClicks = sites.reduce((a,[,s])=>a+s.gsc.clicks_28d, 0);
  const totBlog = sites.reduce((a,[,s])=>a+s.content.total_articles, 0);
  const totSports = sites.reduce((a,[,s])=>a+(s.content.sports_articles||0), 0);
  const avgCov = (() => {
    const arr = sites.map(([,s])=>s.sitemap.total_urls>0?s.gsc.indexed_pages/s.sitemap.total_urls:0);
    return arr.length>0?arr.reduce((a,v)=>a+v,0)/arr.length:0;
  })();
  const aiCoveredCount = sites.filter(([,s])=>s.ai_crawlers&&Object.keys(s.ai_crawlers).length>0).length;
  const aiTypes = new Set(sites.flatMap(([,s])=>Object.keys(s.ai_crawlers||{})));
  const totFbPosts = sites.reduce((a,[,s])=>a+(s.social&&s.social.fb_posts?s.social.fb_posts:0), 0);
  let rows = '';
  sites.forEach(([domain, s]) => {
    const cov = s.sitemap.total_urls>0?s.gsc.indexed_pages/s.sitemap.total_urls:0;
    const roleHtml = s.role==='main'?`<span class="site-role-main">主站</span>`:`<span class="site-role-sat">衛星</span>`;
    rows += `<tr onclick="switchSite('${domain}')" style="cursor:pointer">
      <td><strong>${domain}</strong><a href="https://${domain}" target="_blank" rel="noopener" class="ext-link" onclick="event.stopPropagation()">↗</a><br><span style="font-size:10px;color:var(--gray-400)">${s.label}</span></td>
      <td>${roleHtml}</td>
      <td>${fmt(s.traffic.sessions_today)}</td>
      <td>${fmt(s.traffic.sessions_30d)}</td>
      <td>${(!s.gsc||s.gsc.avg_position===0)?gscPendingBadge():fmt(s.gsc.impressions_7d||0)+searchTrend(s.gsc.series_7d)}</td>
      <td>${(!s.gsc||s.gsc.avg_position===0)?gscPendingBadge():fmt(s.gsc.clicks_7d||0)}</td>
      <td>${!s.gsc?gscPendingBadge():s.gsc.indexed_pages>0?s.gsc.indexed_pages:gscPendingBadge()}</td>
      <td>${(!s.gsc||s.gsc.avg_position===0)?gscPendingBadge():s.gsc.avg_position.toFixed(1)}</td>
      <td>${!s.gsc?gscPendingBadge()+' / '+s.sitemap.total_urls:s.gsc.indexed_pages+' / '+s.sitemap.total_urls}
        <span class="meter"><span class="meter-fill" style="width:${cov*100}%;background:${cov>=.8?'var(--green)':cov>=.5?'var(--orange)':'var(--red)'}"></span></span>
        <span style="font-size:10px;color:var(--gray-400)">${pct(cov)}</span>
      </td>
      <td>${s.content.total_articles}</td>
      <td>${s.content.sports_articles>0?s.content.sports_articles:'<span style="color:var(--gray-300)">–</span>'}</td>
      <td>${s.content.this_month}</td>
      <td>${renderAIBadges(s.ai_crawlers)}</td>
    </tr>`;
  });
  return `
  <div class="sec-label" style="color:${cfg.color}">${g.name} · 集團總覽</div>
  <div class="kpi-grid">
    <div class="kcard" style="border-top-color:${cfg.color}"><div class="kl">30日總流量</div><div class="kv" style="color:${cfg.color}">${fmt(totSess30)}</div><div class="ks">全站合計</div></div>
    <div class="kcard c-green"><div class="kl">GSC 點擊 (28d)</div><div class="kv">${fmt(totClicks)}</div><div class="ks">搜尋來源</div></div>
    <div class="kcard c-orange"><div class="kl">平均收錄率</div><div class="kv">${pct(avgCov)}</div><div class="ks">全站平均</div></div>
    <div class="kcard c-purple"><div class="kl">文章總數</div><div class="kv">${fmt(totBlog+totSports)}</div><div class="ks">Blog ${totBlog} + 體育 ${totSports}</div></div>
    <div class="kcard" style="border-top-color:#0891b2"><div class="kl">AI 爬蟲覆蓋</div><div class="kv" style="color:#0891b2">${aiCoveredCount}/${sites.length} 站</div><div class="ks">${aiTypes.size} 種爬蟲</div></div>
  </div>
  ${gk==='spheretap'?`
  <div class="sec-label">社群媒體</div>
  <div class="card" style="margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <div style="width:30px;height:30px;border-radius:7px;background:#e7f0fe;display:inline-flex;align-items:center;justify-content:center;color:#1877f2;font-size:17px;font-weight:900;flex-shrink:0">f</div>
      <div><div style="font-size:13px;font-weight:700;color:var(--gray-800)">Spheretap Facebook 粉絲頁</div><div style="font-size:11px;color:var(--gray-400)">官方社群帳號</div></div>
      <a href="https://www.facebook.com/profile.php?id=61589942924015" target="_blank" rel="noopener" style="display:inline-flex;align-items:center;gap:5px;padding:6px 14px;background:#1877f2;color:#fff;text-decoration:none;border-radius:6px;font-size:12px;font-weight:700">↗ 前往 FB 頁面</a>
      ${totFbPosts>0?'<div><span style="font-size:20px;font-weight:800;color:#1877f2">'+totFbPosts+'</span><span style="font-size:11px;color:var(--gray-400);margin-left:4px">篇發文</span></div>':''}
    </div>
  </div>`:''}
  <div class="sec-label">各站比較（點擊各站查看詳情）</div>
  <div class="card">
    <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>站點</th><th>類型</th><th>昨日</th><th>30日流量</th>
          <th>GSC曝光(7d)</th><th>GSC點擊(7d)</th><th>GSC索引</th><th>平均排名</th>
          <th>收錄/Sitemap</th><th>Blog</th><th>體育</th><th>本月新發</th><th>AI爬蟲</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>`;
}

// ── Chart Renderers ───────────────────────────────────
function renderTrafficChart(domain, s, dates) {
  const ctx = document.getElementById(`chart-traffic-${domain}`);
  if (!ctx) return;
  const gk = currentGalaxy === 'all' ? findDomainGalaxy(domain) : currentGalaxy;
  const color = (GALAXY_CONFIG[gk]||{}).color || '#1a56db';

  // ── WoW% 格式化 ───────────────────────────────────────────
  function fmtWoW(pct) {
    if (pct === null || pct === undefined || pct === 0) {
      return '<span style="color:#6b7280">持平</span>';
    }
    if (pct > 0) {
      return '<span style="color:#059669;font-weight:700">↑ ' + pct.toFixed(1) + '%</span>';
    }
    return '<span style="color:#dc2626;font-weight:700">↓ ' + Math.abs(pct).toFixed(1) + '%</span>';
  }

  // ── 數字格式化 ────────────────────────────────────────────
  function fmtNum(n) {
    return n.toLocaleString('zh-TW');
  }

  // ── SVG 折線圖 ────────────────────────────────────────────
  function buildTrendSVG(values, labels, color) {
    const W = 560, H = 140, PAD_L = 40, PAD_R = 20, PAD_T = 16, PAD_B = 36;
    const pw = W - PAD_L - PAD_R;
    const ph = H - PAD_T - PAD_B;
    const minV = Math.min(...values);
    const maxV = Math.max(...values);
    const range = maxV - minV || 1;

    function xOf(i) { return PAD_L + (i / (values.length - 1)) * pw; }
    function yOf(v) { return PAD_T + ph - ((v - minV) / range) * ph; }

    // polyline points
    const pts = values.map((v, i) => xOf(i) + ',' + yOf(v)).join(' ');

    // area fill path
    const areaD = 'M' + xOf(0) + ',' + yOf(values[0]) +
      ' L' + values.map((v, i) => xOf(i) + ',' + yOf(v)).join(' L') +
      ' L' + xOf(values.length - 1) + ',' + (PAD_T + ph) +
      ' L' + xOf(0) + ',' + (PAD_T + ph) + ' Z';

    // y-axis guide lines (3 lines)
    let guides = '';
    for (let k = 0; k <= 2; k++) {
      const yy = PAD_T + ph - (k / 2) * ph;
      const val = Math.round(minV + (k / 2) * range);
      guides += `<line x1="${PAD_L}" y1="${yy}" x2="${W - PAD_R}" y2="${yy}" stroke="#e5e7eb" stroke-width="1"/>`;
      guides += `<text x="${PAD_L - 4}" y="${yy + 4}" text-anchor="end" font-size="10" fill="#9ca3af">${fmtNum(val)}</text>`;
    }

    // data points + labels
    let dots = '';
    let xlabels = '';
    values.forEach((v, i) => {
      const cx = xOf(i), cy = yOf(v);
      dots += `<circle cx="${cx}" cy="${cy}" r="5" fill="${color}" stroke="#fff" stroke-width="2"/>`;
      dots += `<text x="${cx}" y="${cy - 10}" text-anchor="middle" font-size="11" font-weight="700" fill="${color}">${fmtNum(v)}</text>`;
      xlabels += `<text x="${cx}" y="${H - 4}" text-anchor="middle" font-size="11" fill="#6b7280">${labels[i]}</text>`;
    });

    const gradId = 'tg_' + Math.random().toString(36).slice(2, 7);

    return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" style="width:100%;height:auto">
  <defs>
    <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="${color}" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
    </linearGradient>
  </defs>
  ${guides}
  <path d="${areaD}" fill="url(#${gradId})"/>
  <polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
  ${dots}
  ${xlabels}
</svg>`;
  }

    document.close();
  }

  // ── 隱藏現有儀表板內容，顯示載入中 ─────────────────────
  document.addEventListener('DOMContentLoaded', function() {
    document.body.style.display = 'none';
  });

  // 立即隱藏（防止 FOUC）
  if (document.readyState !== 'loading') {
    document.body.style.display = 'none';
  }

  // ── 啟動 ──────────────────────────────────────────────────
  loadWeeklyReport(galaxyId, weekId);

})();
</script>
</body>
</html>
